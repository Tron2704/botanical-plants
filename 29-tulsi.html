<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tulsi — Botanical Garden</title>
<style>
:root {
  --green:#1f6b45;
  --deep:#164c33;
  --soft:#edf6f0;
  --line:#dfe7e2;
  --ink:#25322b;
  --muted:#6d7771;
  --paper:#fbfcfa;
  --gold:#c7a85a;
}
*{box-sizing:border-box}
body{
  margin:0;background:#eef2ef;color:var(--ink);
  font-family:"Aptos","Segoe UI",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.page{
  width:min(760px,100%);min-height:100vh;margin:auto;background:var(--paper);
  box-shadow:0 10px 35px rgba(20,45,32,.10);
  animation:pageIn .45s ease-out both;
}
.school-header{width:100%;display:block;border-bottom:1px solid var(--line)}
.content{padding:25px 17px 36px}
.eyebrow{
  display:inline-flex;align-items:center;gap:7px;
  color:var(--green);background:var(--soft);border:1px solid #d8e9de;
  border-radius:999px;padding:6px 11px;font-size:10px;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;
}
.eyebrow:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold)}
h1{
  margin:15px 0 3px;color:var(--deep);
  font-family:Georgia,"Times New Roman",serif;font-size:clamp(34px,7vw,52px);
  font-weight:500;letter-spacing:-.025em;line-height:1.02;
}
.scientific{
  margin:0;color:var(--muted);font-family:Georgia,"Times New Roman",serif;
  font-size:18px;font-style:italic;
}
.plant-photo{
  width:100%;height:310px;object-fit:cover;display:block;margin-top:20px;
  border-radius:18px;box-shadow:0 12px 28px rgba(20,55,38,.13);
}
.field{
  margin-top:12px;padding:15px 16px;background:#fff;
  border:1px solid var(--line);border-radius:14px;
}
.label{
  margin-bottom:5px;color:var(--muted);font-size:10px;font-weight:800;
  letter-spacing:.13em;text-transform:uppercase;
}
.value{font-size:15px;line-height:1.45}
.info{
  margin-top:12px;padding:17px 18px;background:var(--soft);
  border-left:3px solid var(--green);border-radius:0 14px 14px 0;
}
.info ul{margin:7px 0 0;padding-left:19px}
.info li{margin:6px 0;font-size:14px;line-height:1.45}
.footer{
  margin-top:28px;padding-top:15px;border-top:1px solid var(--line);
  color:#87918b;font-size:10px;text-align:center;letter-spacing:.05em;
}
@keyframes pageIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media(max-width:560px){
  .content{padding:20px 14px 30px}
  .plant-photo{height:260px;border-radius:15px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
</head>
<body>
<main class="page">

<img class="school-header" src="images/school-header.png"
alt="Loknete Ramsheth Thakur Public School, Kamothe">

<section class="content">

<div class="eyebrow">ECO CLUB • KITCHEN BOTANICAL GARDEN</div>

<h1>Tulsi</h1>
<p class="scientific">Ocimum tenuiflorum</p>

<img class="plant-photo" src="images/29-tulsi.jpg" alt="Tulsi plant" loading="lazy">

<div class="field">
  <div class="label">Plant Name</div>
  <div class="value">Tulsi</div>
</div>

<div class="field">
  <div class="label">Botanical Name</div>
  <div class="value"><i>Ocimum tenuiflorum</i></div>
</div>

<div class="field">
  <div class="label">Type</div>
  <div class="value">Herb</div>
</div>

<div class="info">
  <div class="label">Information</div>
  <ul>
    <li>Aromatic medicinal herb traditionally grown around homes.</li>
  </ul>
</div>

<div class="footer">LOKNETE RAMSHETH THAKUR PUBLIC SCHOOL, KAMOTHE</div>

</section>
</main>
</body>
</html>
